<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mise en bol</title>
<meta name="theme-color" content="#c4551b">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<style>:root{--bg:#faf6ef;--card:#fff;--ink:#2b2622;--mut:#7a6f64;--line:#e8dfd1;--acc:#c4551b;--acc2:#8a3a10;--soft:#f4e6d6;--ok:#2f7d4f;--warn:#b7791f;--stop:#b3261e;--leaf:#4c7a3c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d1a17;--card:#27231f;--ink:#f0e9df;--mut:#a89d90;--line:#3a342d;--acc:#f08a4b;--acc2:#ffb27d;--soft:#3a2d22;--ok:#6cc08a;--warn:#e5b45a;--stop:#ff8a80;--leaf:#8fc27d}}
:root[data-theme=dark]{--bg:#1d1a17;--card:#27231f;--ink:#f0e9df;--mut:#a89d90;--line:#3a342d;--acc:#f08a4b;--acc2:#ffb27d;--soft:#3a2d22;--ok:#6cc08a;--warn:#e5b45a;--stop:#ff8a80;--leaf:#8fc27d}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
header.top h1{font:700 20px/1 Georgia,serif;margin:0;flex:1;color:var(--acc2)}
header.top h1 a{color:inherit;text-decoration:none}
.nav{display:flex;gap:6px}
.nav a,.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);text-decoration:none;color:var(--ink);font-size:14px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc,#fff);font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--stop)}
.btn:disabled{opacity:.45}
main{max-width:860px;margin:0 auto;padding:16px 16px 80px}
.search{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc,#fff)}
.chip.leaf.on{background:var(--leaf);border-color:var(--leaf)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:inherit;display:block}
.card h3{margin:0 0 4px;font:600 17px/1.25 Georgia,serif}
.card p{margin:0 0 8px;color:var(--mut);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--mut)}
.tag{padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--acc2);font-size:12px}
.tag.leaf{background:#e3efdc;color:#2c5a1f}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .tag.leaf{background:#2b3a26;color:#b5dca5}}
h2{font:700 24px/1.2 Georgia,serif;margin:6px 0}
h3.sec{font:600 14px/1 system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:24px 0 10px}
.muted{color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.stepper button{border:0;background:none;padding:6px 14px;font-size:18px}
.stepper span{min-width:90px;text-align:center}
select{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.warn{padding:10px 12px;border-radius:10px;margin:8px 0;font-size:14px;border:1px solid var(--line);background:var(--card)}
.warn.stop{border-color:var(--stop);color:var(--stop)}
.warn.info{border-left:4px solid var(--warn)}
ul.ings{list-style:none;padding:0;margin:0;background:var(--card);border:1px solid var(--line);border-radius:14px}
ul.ings li{display:flex;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
ul.ings li:last-child{border:0}
ul.ings .q{min-width:92px;font-weight:600}
ul.ings .n{flex:1}
ul.ings .rep{font-size:12px;color:var(--leaf)}
ul.ings input.qty{width:80px;padding:5px 8px;border:1px solid var(--acc);border-radius:8px;background:var(--bg)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 52px;margin-bottom:8px;position:relative}
.steps li:before{content:counter(s);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--onacc,#fff);display:grid;place-items:center;font-weight:700;font-size:14px}
.steps h4{margin:0 0 2px;font-size:16px}
.steps p{margin:0 0 6px}
.settings{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{padding:3px 10px;border-radius:8px;background:var(--soft);color:var(--acc2);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.pill.four{background:#e8e2f3;color:#4b3a7a}
.stepings{font-size:13px;color:var(--mut);margin-top:4px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);max-width:520px;width:calc(100% - 24px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 10px;font:700 20px Georgia,serif}
.opt{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin:8px 0}
.opt b{display:block}
.opt small{color:var(--mut);display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}
textarea{width:100%;min-height:70px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.modifs{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:14px}
.modifs ul{margin:4px 0 0;padding-left:20px}
/* mode cuisine */
#cook{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column}
#cook .ctop{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line)}
#cook .ctop .t{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cook .prog{height:4px;background:var(--line)}#cook .prog i{display:block;height:100%;background:var(--acc);transition:width .2s}
#cook .cbody{flex:1;overflow:auto;padding:20px 20px 12px;max-width:760px;width:100%;margin:0 auto}
#cook h2{font-size:28px}
#cook .ctext{font-size:20px;line-height:1.5}
.dial{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.dial div{flex:1;min-width:96px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px}
.dial small{display:block;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.dial b{font:700 26px/1.2 Georgia,serif;font-variant-numeric:tabular-nums}
.cing{list-style:none;padding:0;margin:14px 0}
.cing li{padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:18px}
.cing b{color:var(--acc2)}
#cook .cfoot{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
#cook .cfoot .btn{flex:1;justify-content:center;padding:14px;font-size:17px}
.timer{font:700 40px Georgia,serif;text-align:center;margin:10px 0;font-variant-numeric:tabular-nums}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:99;font-size:14px}
@media print{header.top,.bar,.nav,.btn{display:none!important}}
:root[data-theme=dark] .tag.leaf{background:#2b3a26;color:#b5dca5}
header.top #theme{padding:6px 12px}

<script>/* Moteur de règles de « Mise en bol » : recherche, portions, capacité du bol, modèles, remplacements.

var Engine = (function () {
  "use strict";

  var ING = {}, RECIPES = [], SUBS = {}, INDEX = {};

  var UNIT_FR = { g: "g", ml: "ml", cc: "c. à café", cs: "c. à soupe" };

  /* ---------- outils ---------- */

  function tol(len) { return len <= 3 ? 0 : len <= 6 ? 1 : 2; }

  /* ---------- données ---------- */
  function ingDef(recipe, id) {

  function regimesOf(recipe) {

    });

  function buildIndex(r) {

    });
    [r.description, (r.tags || []).join(" "), (CATS.filter(function (c) { return c[0] === r.categorie; })[0] || [0, ""])[1], r.leger ? "leger light healthy allege" : ""].forEach(function (t) {
      norm(t).split(" ").forEach(function (x) { if (x.length > 2) other.push(stem(x)); });
    });
    return { title: title, ingr: ingr, other: other, regimes: regimesOf(r).list };

  function init(data) {

  var SYN = { carbo: "carbonara", bolo: "bolognaise", patate: "pomme terre", patates: "pomme terre", potage: "soupe", cake: "gateau", flan: "creme", tiramisu: "mascarpone", crepe: "crepes" };

  function parseQuery(q) {

    [["sans gluten", "sans-gluten"], ["sans lactose", "sans-lactose"], ["sans oeuf", "sans-oeuf"], ["sans oeufs", "sans-oeuf"], ["sans fruits a coque", "sans-fruits-a-coque"],

  function tokenScore(t, ix) {

      else if (t.length >= 3 && w.indexOf(t) === 0) best = Math.max(best, 8);
      else if (t.length >= 4 && lev(t, w, tl) <= tl) best = Math.max(best, 6);
    }
    if (best >= 8) return best;
    for (i = 0; i < ix.ingr.length; i++) {
      w = ix.ingr[i];
      if (w === t) best = Math.max(best, 4);
      else if (t.length >= 3 && w.indexOf(t) === 0) best = Math.max(best, 3);
      else if (t.length >= 5 && lev(t, w, tl) <= tl) best = Math.max(best, 2);

    for (k = 0; k < ix.other.length; k++) {
      w = ix.other[k];
      if (w === t) best = Math.max(best, 2);
      else if (t.length >= 4 && w.indexOf(t) === 0) best = Math.max(best, 1.5);

    return best;
  }

  /* opts : { q, cat, regs:[], leger:bool, rapide:bool } -> { results:[recette], approx:bool } */
  function search(opts) {

    var leger = !!opts.leger || pq.leger;

  /* ---------- affichage des quantités ---------- */
  var FR = { 0.25: "¼", 0.5: "½", 0.75: "¾" };
  function fmtNum(q) {
    var w = Math.floor(q + 1e-9), f = Math.round((q - w) * 100) / 100;
    if (f === 0) return String(w);
    if (FR[f]) return (w ? w : "") + FR[f];
    if (Math.abs(f - 0.33) < 0.02) return (w ? w : "") + "⅓";
    if (Math.abs(f - 0.67) < 0.02) return (w ? w : "") + "⅔";

  }
  /* -> { q: "250 g", nom: "farine de blé T55" } */
  function ingParts(recipe, i) {
    var d = ingDef(recipe, i.id) || { nom: i.nom || i.id, pluriel: "" };
    if (i.u === "gout") return { q: "au goût", nom: d.nom };
    var n = fmtNum(i.q), plural = i.q > 1;
    switch (i.u) {
      case "g": case "ml": return { q: n + " " + i.u, nom: d.nom };
      case "cc": return { q: n + " c. à café", nom: d.nom };
      case "cs": return { q: n + " c. à soupe", nom: d.nom };
      case "pincee": return { q: n + " pincée" + (plural ? "s" : ""), nom: d.nom };
      case "branche": return { q: n + " branche" + (plural ? "s" : ""), nom: d.nom };
      case "feuille": return { q: n + " feuille" + (plural ? "s" : ""), nom: d.nom };
      case "tranche": return { q: n + " tranche" + (plural ? "s" : ""), nom: d.nom };
      case "sachet": return { q: n + " sachet" + (plural ? "s" : ""), nom: d.nom };
      default: return { q: n, nom: plural && d.pluriel ? d.pluriel : d.nom };
    }
  }
  function fmtDur(s) {
    s = Math.round(s);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60, out = [];
    if (h) out.push(h + " h");
    if (m) out.push(m + " min");
    if (x) out.push(x + " s");
    if (h && m && !x) return h + " h " + (m < 10 ? "0" + m : m);
    return out.join(" ") || "0 s";
  }
  function fmtDurMin(min) { return fmtDur(min * 60); }
  function fmtSpeed(v, model) {
    v = String(v);
    if (v === "mijotage") return model === "TM31" ? "mijotage (cuillère)" : "mijotage";
    if (v === "turbo") return "Turbo";
    if (v === "petrin") return "Pétrin";
    return v.replace(">", " → ").replace(/(\d)\.(\d)/g, "$1,$2");
  }
  function fmtTemp(t) { return t === "varoma" ? "Varoma" : t + " °C"; }

  /* ---------- quantités : arrondis cohérents ---------- */
  function roundQty(q, u, id) {
    if (u === "g" || u === "ml") {
      if (q < 5) return Math.max(0.5, Math.round(q * 2) / 2);
      if (q < 50) return Math.max(1, Math.round(q));

  }
  function refsOf(recipe, id, u) {

    recipe.etapes.forEach(function (e) { (e.ingredients || []).forEach(function (x) { if (x.id === id && x.u === u && x.q != null) out.push(x); }); });
    return out;
  }
  /* répartit newTotal entre les étapes au prorata ; la somme retombe exactement sur newTotal */
  function rescaleRefs(refs, oldTotal, newTotal, newId, newU, remplace) {
    if (!refs.length) return;
    var raws = refs.map(function (x) { return x.q / oldTotal * newTotal; });
    var rounded = raws.map(function (v, k) { return roundQty(v, newU || refs[k].u, newId || refs[k].id); });
    var diff = Math.round((newTotal - rounded.reduce(function (a, b) { return a + b; }, 0)) * 100) / 100;
    var big = 0; rounded.forEach(function (v, k) { if (v > rounded[big]) big = k; });
    if (rounded[big] + diff > 0) rounded[big] = Math.round((rounded[big] + diff) * 100) / 100;
    refs.forEach(function (x, k) {
      x.q = rounded[k];
      if (newId) { x.id = newId; if (remplace) x.remplace = remplace; }
      if (newU) x.u = newU;
    });
  }

  /* ---------- bol : profil de remplissage ---------- */
  function bowlProfile(recipe) {
    var bowl = 0, water = 0, peak = 0, peakStep = 0, steps = [];
    recipe.etapes.forEach(function (e, n) {
      var inBowl = e.reglages || e.dans_bol;
      if (inBowl) {
        (e.ingredients || []).forEach(function (x) {
          if ((x.u === "g" || x.u === "ml") && typeof x.q === "number") { bowl += x.q; if (x.id === "eau") water += x.q; }
        });
        if (bowl > peak) { peak = bowl; peakStep = n + 1; }
      }
      steps.push({ bowl: bowl, water: water });
      if (e.vider_bol) { bowl = 0; water = 0; }
    });
    return { peak: peak, peakStep: peakStep, steps: steps };
  }
  function varomaNeed(durS) { return 500 + 250 * Math.max(0, Math.ceil((durS / 60 - 30) / 15)); }

  /* ---------- portions, modèle ---------- */
  function roundDur(s) {
    if (s < 60) return Math.max(5, Math.round(s / 5) * 5);
    if (s < 600) return Math.round(s / 10) * 10;

  }

  function adaptModel(r, model, W) {
    var done = false;

  function scale(recipe, portions, model) {

      });

      var timeAdj = false;

    el.innerHTML = (r.approx ? '<p class="muted">Pas de correspondance exacte, résultats proches :</p>' : "") + '<p class="muted" style="font-size:13px;margin:6px 0">' + r.results.length + ' recette' + (r.results.length > 1 ? "s" : "") + '</p><div class="grid">' + r.results.map(card).join("") + "</div>";
  }
  function regDialog() {
    var h = "<h3>Régimes</h3><p class=\"muted\" style=\"font-size:13px\">Ne garde que les recettes compatibles.</p><div class=\"chips\">" + E.REGS.map(function (g) { return '<button class="chip' + (filt.regs.indexOf(g[0]) !== -1 ? " on" : "") + '" data-reg="' + g[0] + '">' + g[1] + "</button>"; }).join("") + '</div><div class="row"><button class="btn" id="rz">Effacer</button><button class="btn pri" id="ok">Voir les recettes</button></div>';
    var d = dlg(h);
    d.querySelectorAll("[data-reg]").forEach(function (b) { b.onclick = function () { var i = filt.regs.indexOf(b.dataset.reg); if (i === -1) filt.regs.push(b.dataset.reg); else filt.regs.splice(i, 1); b.classList.toggle("on"); }; });
    d.querySelector("#rz").onclick = function () { filt.regs = []; d.querySelectorAll("[data-reg]").forEach(function (b) { b.classList.remove("on"); }); };
    d.querySelector("#ok").onclick = function () { filt.all = true; d.close(); updHome(); };
  }

  /* ---------- recette ---------- */
  function openRecipe(id) {
    var r = E.getRecipe(id);
    if (!r) return viewHome();
    cur = { base: E.clone(r), portions: r.portions, sid: null, editing: false, orig: id };
    viewRecipe();
  }
  function openSaved(sid) {
    var s = S.saved.filter(function (x) { return x.sid === sid; })[0];
    if (!s) return viewSaved();
    cur = { base: E.clone(s.recipe), portions: s.recipe.portions, sid: sid, editing: false, orig: s.recipe.id };
    viewRecipe();
  }
  function fmtSet(g, model) {
    var out = [];
    out.push('<span class="pill">⏱ ' + (g.approx ? "≈ " : "") + E.fmtDur(g.duree_s) + "</span>");
    if (g.temp) out.push('<span class="pill">🌡 ' + E.fmtTemp(g.temp) + "</span>");
    out.push('<span class="pill">⚙ ' + E.fmtSpeed(g.vitesse, model) + "</span>");
    if (g.inverse) out.push('<span class="pill">↺ sens inverse</span>');
    return out.join("");
  }
  var ACC = { papillon: "Papillon en place", panier: "Panier de cuisson", varoma: "Varoma en place" };
  function ingLine(r, i) {
    var p = E.ingParts(r, i);
    return "<b>" + esc(p.q) + "</b> " + esc(p.nom);
  }
  function viewRecipe() {
    var base = cur.base, sc = E.scale(base, cur.portions, S.model), r = sc.recipe, ed = cur.editing;
    var rg = E.regimesOf(r).list, tags = [];
    E.REGS.forEach(function (g) { if (rg.indexOf(g[0]) !== -1) tags.push('<span class="tag">' + g[1] + "</span>"); });
    var lighter = E.lighterOf(base.id).filter(function () { return !cur.sid; });
    var h = '<a href="' + (cur.sid ? "#/mes" : "#/") + '" class="muted" style="text-decoration:none">← Retour</a><h2>' + esc(r.titre) + '</h2><p class="muted" style="margin:0 0 8px">' + esc(r.description) + "</p>" +
      '<div class="meta" style="margin-bottom:6px"><span>⏱ préparation ' + E.fmtDurMin(r.temps.preparation_min) + " · cuisson " + E.fmtDurMin(r.temps.cuisson_min) + "</span><span>· " + esc(r.difficulte) + "</span></div>" +
      (r.leger && r.derive_de ? '<div class="warn info" style="border-left-color:var(--leaf)">🌿 <b>Version allégée</b>' + (E.getRecipe(r.derive_de) ? ' de <a href="#/r/' + r.derive_de + '">' + esc(E.getRecipe(r.derive_de).titre) + "</a>" : "") + (r.allegements && r.allegements.length ? "<br>" + r.allegements.map(esc).join(" · ") : "") + "</div>" : "") +
      (lighter.length ? '<div class="warn info" style="border-left-color:var(--leaf)">🌿 Version allégée : ' + lighter.map(function (l) { return '<a href="#/r/' + l.id + '">' + esc(l.titre) + "</a>"; }).join(", ") + "</div>" : "") +
      '<div class="meta" style="margin:6px 0">' + tags.join("") + "</div>" +
      '<div class="bar"><div class="stepper"><button id="pm" aria-label="moins">−</button><span>' + cur.portions + " portion" + (cur.portions > 1 ? "s" : "") + '</span><button id="pp" aria-label="plus">+</button></div>' +
      '<select id="model" aria-label="Modèle">' + Object.keys(E.MODELS).map(function (m) { return '<option value="' + m + '"' + (m === S.model ? " selected" : "") + ">Thermomix " + m + "</option>"; }).join("") + "</select></div>";
    if (cur.portions < base.portions_min || cur.portions > base.portions_max) h += '<div class="warn info">Cette recette est prévue pour ' + base.portions_min + " à " + base.portions_max + " portions : au-delà, les résultats sont moins sûrs.</div>";
    sc.warnings.forEach(function (w) { h += '<div class="warn ' + w.level + '">' + (w.level === "stop" ? "⛔ " : "ℹ️ ") + esc(w.text) + "</div>"; });
    if (r.verifier) h += '<div class="warn info">🧪 Recette non testée sur une vraie machine : vérifie les temps et la texture au premier essai.</div>';
    if (r.modifs && r.modifs.length) h += '<div class="modifs"><b>Modifications :</b><ul>' + r.modifs.map(function (m) { return "<li>" + esc(m) + "</li>"; }).join("") + "</ul></div>";

    h += '<h3 class="sec">Ingrédients</h3><ul class="ings">' + r.ingredients.map(function (i, k) {
      var p = E.ingParts(r, i), sub = E.subsFor(r, i.id);
      var q = ed && i.q != null ? '<input class="qty" data-k="' + k + '" type="number" step="any" min="0" value="' + i.q + '"> ' + (i.u === "g" || i.u === "ml" ? i.u : "") : esc(p.q);
      return '<li><span class="q">' + q + '</span><span class="n">' + esc(p.nom) + (i.remplace ? ' <span class="rep">(remplace ' + esc((E.getIng(i.remplace) || { nom: i.remplace }).nom) + ")</span>" : "") + "</span>" +
        (!ed && sub && (sub.options.length || sub.sans) ? '<button class="btn sm ghost" data-sub="' + k + '" title="Remplacer ou retirer">⇄</button>' : "") + "</li>";
    }).join("") + "</ul>";

    h += '<h3 class="sec">Étapes</h3><ol class="steps">' + r.etapes.map(function (e, n) {
      var s = "<h4>" + esc(e.titre) + "</h4><p>" + esc(e.texte) + "</p>";
      if (e.accessoire && e.accessoire !== "aucun") s += '<div class="settings"><span class="pill">' + esc(ACC[e.accessoire] || e.accessoire) + "</span></div>";
      if (e.reglages) s += '<div class="settings">' + fmtSet(e.reglages, S.model) + "</div>";
      if (e.four) s += '<div class="settings"><span class="pill four">🔥 Four ' + (ed ? '<input class="qty" data-ft="' + n + '" style="width:60px" type="number" value="' + e.four.temp + '"> °C · <input class="qty" data-fd="' + n + '" style="width:60px" type="number" value="' + e.four.duree_min + '"> min' : e.four.temp + " °C · " + e.four.duree_min + " min") + " · " + esc(e.four.mode === "chaleur-tournante" ? "chaleur tournante" : e.four.mode) + "</span></div>";
      if (e.pause) s += '<div class="settings"><span class="pill">⏳ ' + esc(e.pause.libelle) + " · " + E.fmtDurMin(e.pause.duree_min) + "</span></div>";
      if (e.ingredients && e.ingredients.length) s += '<div class="stepings">' + e.ingredients.map(function (i) { return ingLine(r, i); }).join(" · ") + "</div>";
      return "<li>" + s + "</li>";
    }).join("") + "</ol>";
    if (r.astuces && r.astuces.length) h += '<h3 class="sec">Astuces</h3><ul>' + r.astuces.map(function (a) { return "<li>" + esc(a) + "</li>"; }).join("") + "</ul>";
    if (r.conservation) h += '<p class="muted"><b>Conservation :</b> ' + esc(r.conservation) + "</p>";
    if (r.notes) h += '<div class="modifs"><b>Mes notes :</b><br>' + esc(r.notes).replace(/\n/g, "<br>") + "</div>";
    if (ed) h += '<h3 class="sec">Mes notes</h3><textarea id="notes" placeholder="Ex. : j\'ai laissé 5 min de plus, très bon avec un peu de citron.">' + esc(r.notes || "") + "</textarea>";

    h += '<div class="bar" style="position:sticky;bottom:0;background:var(--bg);padding:10px 0;border-top:1px solid var(--line);margin-top:20px">' +
      (ed ? '<button class="btn pri" id="applyEd">Valider mes modifications</button><button class="btn" id="cancelEd">Annuler</button>'
        : '<button class="btn pri" id="gocook">▶ Cuisiner</button><button class="btn" id="save">' + (cur.sid ? "Enregistrer…" : "💾 Enregistrer") + '</button><button class="btn" id="edit">✎ Ce que j\'ai fait</button>') + "</div>";
    shell(h);
    cur.shown = r;

    $("#pm").onclick = function () { cur.portions = Math.max(1, cur.portions - (cur.portions > 12 ? 2 : 1)); viewRecipe(); };
    $("#pp").onclick = function () { cur.portions = Math.min(40, cur.portions + (cur.portions >= 12 ? 2 : 1)); viewRecipe(); };
    $("#model").onchange = function (e) { S.model = e.target.value; persist(); viewRecipe(); };
    document.querySelectorAll("[data-sub]").forEach(function (b) { b.onclick = function () { subDialog(+b.dataset.sub); }; });
    if (ed) {
      $("#applyEd").onclick = applyEdit;
      $("#cancelEd").onclick = function () { cur.editing = false; viewRecipe(); };
    } else {
      $("#gocook").onclick = function () { startCook(cur.shown); };
      $("#save").onclick = saveDialog;
      $("#edit").onclick = function () { cur.base = E.clone(cur.shown); cur.portions = cur.shown.portions; cur.editing = true; viewRecipe(); };
    }
  }

  function applyEdit() {
    var r = cur.base, notes = $("#notes").value;
    document.querySelectorAll("input[data-k]").forEach(function (inp) {
      var k = +inp.dataset.k, v = parseFloat(String(inp.value).replace(",", "."));
      if (v > 0 && r.ingredients[k] && v !== r.ingredients[k].q) r = E.setQty(r, k, v);
    });
    r = E.clone(r);
    document.querySelectorAll("input[data-ft]").forEach(function (inp) {
      var n = +inp.dataset.ft, v = parseFloat(inp.value);
      if (v > 0 && r.etapes[n].four.temp !== v) { E.pushModif(r, "Four : " + r.etapes[n].four.temp + " → " + v + " °C"); r.etapes[n].four.temp = v; }
    });
    document.querySelectorAll("input[data-fd]").forEach(function (inp) {
      var n = +inp.dataset.fd, v = parseFloat(inp.value);
      if (v > 0 && r.etapes[n].four.duree_min !== v) { E.pushModif(r, "Four : " + r.etapes[n].four.duree_min + " → " + v + " min"); r.etapes[n].four.duree_min = v; }
    });
    if (notes !== (r.notes || "")) r.notes = notes;
    cur.base = r; cur.editing = false; viewRecipe();
    toast("Modifications prises en compte — pense à enregistrer.");
  }

  /* ---------- remplacer / retirer ---------- */
  function dlg(html) {
    var d = document.createElement("dialog"); d.innerHTML = html; document.body.appendChild(d);
    d.addEventListener("close", function () { d.remove(); });
    if (d.showModal) d.showModal(); else d.setAttribute("open", "");
    return d;
  }
  function subDialog(k) {
    var r = cur.shown, ing = r.ingredients[k], nm = (E.getIng(ing.id) || { nom: ing.id }).nom;
    var s = E.subsFor(r, ing.id), h = "<h3>Remplacer : " + esc(nm) + "</h3>";
    if (s && s.options.length) {
      h += s.options.map(function (o, n) {
        return '<div class="opt"><b>' + esc(o.nom) + (o.par_unite ? "" : o.ratio !== 1 ? " (× " + String(o.ratio).replace(".", ",") + ")" : "") + "</b><small>" + esc(o.effet) + "</small><small><i>" + esc(o.ajustement) + '</i></small><div class="row" style="margin-top:6px"><button class="btn sm pri" data-o="' + n + '">Utiliser</button></div></div>';
      }).join("");
    } else h += '<p class="muted">Pas de remplacement proposé pour cet ingrédient.</p>';
    h += '<div class="row">' + (s && s.sans ? '<button class="btn danger" id="rm">Retirer sans remplacer</button>' : "") + '<button class="btn" id="x">Fermer</button></div>';
    if (s && s.sans) h += '<p class="muted" style="font-size:13px">' + esc(s.sans) + "</p>";
    var d = dlg(h);
    d.querySelectorAll("[data-o]").forEach(function (b) {
      b.onclick = function () {
        // on applique sur la recette à l'échelle affichée, puis on devient la nouvelle base
        var out = E.applySub(r, k, s.options[+b.dataset.o]);
        if (out) { cur.base = out; cur.portions = out.portions; }
        d.close(); viewRecipe();
      };
    });
    var rm = d.querySelector("#rm");
    if (rm) rm.onclick = function () { var out = E.removeIngredient(r, k); if (out) { cur.base = out; cur.portions = out.portions; } d.close(); viewRecipe(); };
    d.querySelector("#x").onclick = function () { d.close(); };
  }

  /* ---------- enregistrer ---------- */
  function saveDialog() {
    var r = E.clone(cur.shown), exists = cur.sid && S.saved.some(function (x) { return x.sid === cur.sid; });
    var h = "<h3>Enregistrer la recette</h3><label>Nom<br><input class=\"search\" id=\"nm\" style=\"font-size:16px;padding:10px\" value=\"" + esc(r.titre) + '"></label>' +
      '<div class="row">' + (exists ? '<button class="btn pri" id="upd">Mettre à jour</button><button class="btn" id="nw">Nouvelle version</button>' : '<button class="btn pri" id="nw">Enregistrer</button>') + '<button class="btn" id="x">Annuler</button></div>';
    var d = dlg(h);
    function put(isNew) {
      var name = d.querySelector("#nm").value.trim() || r.titre;
      r.titre = name; r.portions = cur.shown.portions;
      if (!isNew && exists) { S.saved.forEach(function (x) { if (x.sid === cur.sid) { x.recipe = r; x.date = Date.now(); } }); }
      else { var sid = uid(); S.saved.unshift({ sid: sid, date: Date.now(), recipe: r }); cur.sid = sid; }
      persist(); cur.base = E.clone(r); cur.portions = r.portions; d.close(); toast(isNew || !exists ? "Recette enregistrée" : "Recette mise à jour");

    d.querySelector("#nw").onclick = function () { put(true); };
    var u = d.querySelector("#upd"); if (u) u.onclick = function () { put(false); };
    d.querySelector("#x").onclick = function () { d.close(); };
  }

  function viewSaved() {
    var h = "<h2>Mes recettes</h2>";
    if (!S.saved.length) h += '<div class="empty">Rien d\'enregistré pour l\'instant.<br>Ouvre une recette puis touche « Enregistrer ».</div>';
    else h += '<div class="grid">' + S.saved.map(function (s) {
      var r = s.recipe;
      return '<div class="card"><a href="#/s/' + s.sid + '" style="text-decoration:none;color:inherit"><h3>' + esc(r.titre) + "</h3><p>" + r.portions + " portions · " + new Date(s.date).toLocaleDateString("fr-FR") + (r.modifs && r.modifs.length ? " · " + r.modifs.length + " modif." : "") + '</p></a><button class="btn sm danger" data-del="' + s.sid + '">Supprimer</button></div>';
    }).join("") + "</div>";
    shell(h);
    document.querySelectorAll("[data-del]").forEach(function (b) {
      b.onclick = function () {
        if (b.dataset.arm !== "1") { b.dataset.arm = "1"; b.textContent = "Confirmer la suppression"; return; }
        S.saved = S.saved.filter(function (x) { return x.sid !== b.dataset.del; }); persist(); viewSaved();

  /* ---------- réglages ---------- */
  function viewSettings() {
    shell("<h2>Réglages</h2><h3 class=\"sec\">Mon Thermomix</h3><select id=\"m\">" + Object.keys(E.MODELS).map(function (m) { return '<option value="' + m + '"' + (m === S.model ? " selected" : "") + ">Thermomix " + m + "</option>"; }).join("") + "</select>" +
      '<h3 class="sec">Apparence</h3><select id="th">' + THEMES.map(function (t) { return '<option value="' + t[0] + '"' + (t[0] === S.theme ? " selected" : "") + ">" + t[1] + "</option>"; }).join("") + '</select><p class="muted" style="font-size:13px">Auto suit le réglage de ton téléphone ou ordinateur.</p><h3 class="sec">Style</h3><div class="swatches">' + STYLES.map(function (t) { return '<button class="sw' + (t[0] === S.style ? " on" : "") + '" data-style="' + t[0] + '"><i style="background:' + t[2] + '"></i>' + t[1] + "</button>"; }).join("") + '</div><h3 class="sec">Fond</h3><div class="chips">' + WMS.map(function (t) { return '<button class="chip' + (t[0] === S.wm ? " on" : "") + '" data-wm="' + t[0] + '">' + t[1] + "</button>"; }).join("") + '</div><h3 class="sec">Sauvegarde</h3><p class="muted">Tes recettes enregistrées vivent dans ce navigateur. Exporte-les de temps en temps pour ne rien perdre ou les passer sur un autre appareil.</p>' +
      '<div class="bar"><button class="btn" id="exp">Exporter (fichier)</button><label class="btn">Importer<input id="imp" type="file" accept="application/json" hidden></label></div>' +
      '<h3 class="sec">À propos</h3><p class="muted">Les recettes sont écrites pour cette application et n\'ont pas toutes été testées sur une machine : le signalement « non testée » disparaîtra au fil des essais. Thermomix® est une marque de Vorwerk ; cette application n\'est pas affiliée.</p>');
    document.querySelectorAll("[data-style]").forEach(function (b) { b.onclick = function () { S.style = b.dataset.style; S.styleChosen = true; persist(); applyTheme(); viewSettings(); }; });
    document.querySelectorAll("[data-wm]").forEach(function (b) { b.onclick = function () { S.wm = b.dataset.wm; persist(); applyTheme(); viewSettings(); }; });
    $("#th").onchange = function (e) { S.theme = e.target.value; persist(); applyTheme(); viewSettings(); };
    $("#m").onchange = function (e) { S.model = e.target.value; persist(); toast("Modèle enregistré"); };
    $("#exp").onclick = function () {
      var b = new Blob([JSON.stringify({ app: "mise-en-bol", v: 1, saved: S.saved, model: S.model }, null, 1)], { type: "application/json" });

    };
    $("#imp").onchange = function (e) {
      var f = e.target.files[0]; if (!f) return; var rd = new FileReader();
      rd.onload = function () {
        try {
          var d = JSON.parse(rd.result); if (d.app !== "mise-en-bol" || !Array.isArray(d.saved)) throw 0;
          var have = {}; S.saved.forEach(function (x) { have[x.sid] = 1; });

      };
      rd.readAsText(f);
    };
  }

  /* ---------- mode cuisine ---------- */
  var wake = null;
  function startCook(r) {
    cook = { r: r, i: 0, t: null, tEnd: 0 };
    var el = document.createElement("div"); el.id = "cook"; document.body.appendChild(el);
    try { if (navigator.wakeLock) navigator.wakeLock.request("screen").then(function (w) { wake = w; }, function () {}); } catch (e) {}
    var sx = null;
    el.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
    el.addEventListener("touchend", function (e) { if (sx == null) return; var dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 70) cookGo(dx < 0 ? 1 : -1); }, { passive: true });
    drawCook();
  }
  function closeCook() {
    var el = $("#cook"); if (el) el.remove();
    if (cook && cook.t) clearInterval(cook.t);
    cook = null;
    try { if (wake) wake.release(); } catch (e) {} wake = null;
  }
  function leaveCook() { closeCook(); if (cur) viewRecipe(); else viewHome(); }
  function cookGo(d) {
    if (!cook) return;
    var n = cook.r.etapes.length, i = cook.i + d;
    if (i < 0 || i > n) return;
    if (cook.t) { clearInterval(cook.t); cook.t = null; }
    cook.dir = d; cook.i = i; drawCook();
  }
  function stepDur(e) { return e.reglages ? e.reglages.duree_s : e.four ? e.four.duree_min * 60 : e.pause ? e.pause.duree_min * 60 : 0; }
  function fitCook() {
    var b = $("#cook .cbody"); if (!b) return;
    var land = window.matchMedia ? window.matchMedia("(orientation:landscape) and (max-height:520px)").matches : false;
    var fs = land ? 19 : 26, min = 11;
    b.style.fontSize = fs + "px";
    while (fs > min && (b.scrollHeight > b.clientHeight + 1 || b.scrollWidth > b.clientWidth + 1)) { fs -= 0.5; b.style.fontSize = fs + "px"; }
  }
  window.addEventListener("resize", function () { if (cook) fitCook(); });
  function drawCook() {
    var r = cook.r, n = r.etapes.length, el = $("#cook"), i = cook.i;
    if (i >= n) {
      el.innerHTML = '<div class="ctop"><div class="t">' + esc(r.titre) + '</div><button class="btn sm" id="cx">Fermer ✕</button></div><div class="cbody fwd"><div class="cmain"><h2>Bon appétit ! 🎉</h2><p class="ctext">' + (r.conservation ? "<b>Conservation :</b> " + esc(r.conservation) : "") + '</p></div><div class="cside">' + (r.astuces || []).map(function (a) { return '<p class="kp">💡 ' + esc(a) + "</p>"; }).join("") + '</div></div><div class="cfoot"><button class="btn" id="cp">← Précédent</button><button class="btn pri" id="cx2">Terminer</button></div>';
      $("#cx").onclick = $("#cx2").onclick = leaveCook;
      $("#cp").onclick = function () { cookGo(-1); };
      fitCook(); return;
    }
    var e = r.etapes[i], g = e.reglages, d = stepDur(e), tiles = "", h = "";
    function tile(lab, val) { return '<div class="k"><small>' + lab + "</small><b>" + val + "</b></div>"; }
    if (g) {
      if (g.temp) tiles += tile("Temp.", E.fmtTemp(g.temp));
      tiles += tile("Vitesse", E.fmtSpeed(g.vitesse, S.model));
      if (g.inverse) tiles += tile("Sens", "↺");
    }
    if (e.four) tiles += tile("Four", e.four.temp + " °C");
    if (d) tiles = '<button class="k tm" id="tm"><small>' + (e.pause ? esc(e.pause.libelle) : "Durée") + ' · lancer ▶</small><b id="tmv">' + (g && g.approx ? "≈ " : "") + E.fmtDur(d) + "</b></button>" + tiles;
    h += '<div class="ctop"><div class="t">' + esc(r.titre) + " · étape " + (i + 1) + "/" + n + '</div><button class="btn sm" id="cx">Fermer ✕</button></div><div class="prog"><i style="width:' + ((i + 1) / n * 100) + '%"></i></div>';
    h += '<div class="cbody ' + (cook.dir < 0 ? "back" : "fwd") + '"><div class="cmain"><h2>' + esc(e.titre) + '</h2><p class="ctext">' + esc(e.texte) + '</p></div><div class="cside">';
    if (e.accessoire && e.accessoire !== "aucun") h += '<div class="kp">🔧 ' + esc(ACC[e.accessoire] || e.accessoire) + "</div>";
    if (tiles) h += '<div class="kd">' + tiles + "</div>";
    if (e.ingredients && e.ingredients.length) h += '<ul class="ki">' + e.ingredients.map(function (x) { return "<li>" + ingLine(r, x) + "</li>"; }).join("") + "</ul>";
    h += '</div></div><div class="cfoot"><button class="btn" id="cp"' + (i === 0 ? " disabled" : "") + '>← Précédent</button><button class="btn pri" id="cn">' + (i === n - 1 ? "Terminer" : "Suivant →") + "</button></div>";
    el.innerHTML = h;
    $("#cx").onclick = leaveCook;
    $("#cp").onclick = function () { cookGo(-1); };
    $("#cn").onclick = function () { cookGo(1); };
    var ts = $("#tm");
    if (ts) ts.onclick = function () {
      var lab = ts.querySelector("small"), val = $("#tmv");
      if (cook.t) { clearInterval(cook.t); cook.t = null; ts.classList.remove("run"); lab.textContent = "Durée · lancer ▶"; val.textContent = E.fmtDur(d); return; }
      cook.tEnd = Date.now() + d * 1000; ts.classList.add("run"); lab.textContent = "En cours · arrêter";
      cook.t = setInterval(function () {
        var left = Math.max(0, Math.round((cook.tEnd - Date.now()) / 1000)), v = $("#tmv");
        if (!v) return; v.textContent = E.fmtDur(left);
        if (left <= 0) { clearInterval(cook.t); cook.t = null; ts.classList.remove("run"); ts.classList.add("done"); lab.textContent = "Terminé"; v.textContent = "0 s"; try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (x) {} beep(); }
      }, 250);
    };
    fitCook();
  }
  function beep() {
    try { var c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(); o.frequency.value = 880; o.connect(c.destination); o.start(); setTimeout(function () { o.stop(); }, 700); } catch (e) {}
  }
  document.addEventListener("keydown", function (e) { if (!cook) return; if (e.key === "ArrowRight") cookGo(1); if (e.key === "ArrowLeft") cookGo(-1); if (e.key === "Escape") leaveCook(); });

  document.addEventListener("pointerdown", function (e) {
    var t = e.target.closest && e.target.closest(".btn,.chip,.card,.sw,.stepper button");
    if (!t || t.disabled) return;
    var rc = t.getBoundingClientRect(), sz = Math.max(rc.width, rc.height) * 2, sp = document.createElement("span");
    sp.className = "rip"; sp.style.cssText = "width:" + sz + "px;height:" + sz + "px;left:" + (e.clientX - rc.left - sz / 2) + "px;top:" + (e.clientY - rc.top - sz / 2) + "px";
    t.appendChild(sp); setTimeout(function () { sp.remove(); }, 600);
    try { if (t.id === "cn" || t.id === "cp") navigator.vibrate && navigator.vibrate(8); } catch (x) {}
  });
  window.addEventListener("hashchange", function () { if (location.hash !== H) { H = location.hash; route(); } });
  window.MEB = { route: route, state: function () { return { S: S, cur: cur, cook: cook }; } };
  route();
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
